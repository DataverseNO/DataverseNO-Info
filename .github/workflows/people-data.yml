name: People data

on:
  workflow_dispatch:
  push:
    paths:
      - data/sources/people.tsv
      - data/partners.yml
      - data/people.yml
      - scripts/generate_people_yml.py
      - scripts/validate_people_yml.py
      - .github/workflows/people-data.yml
  pull_request:
    paths:
      - data/sources/people.tsv
      - data/partners.yml
      - data/people.yml
      - scripts/generate_people_yml.py
      - scripts/validate_people_yml.py
      - .github/workflows/people-data.yml

permissions:
  contents: read

jobs:
  generate-and-validate:
    name: Generate and validate people.yml
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Generate data/people.yml from data/sources/people.tsv
        run: python scripts/generate_people_yml.py

      - name: Validate generated data/people.yml
        run: python scripts/validate_people_yml.py

      - name: Check that generated data/people.yml is committed
        run: |
          if ! git diff --quiet -- data/people.yml; then
            echo "data/people.yml is not in sync with data/sources/people.tsv and data/partners.yml."
            echo "Run scripts/generate_people_yml.py locally and commit the updated data/people.yml."
            git diff -- data/people.yml
            exit 1
          fi
