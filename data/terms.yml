  open-science:
    label:
      en: Open Science
      nn: open vitskap
    short_definition:
      en: An approach to research that promotes openness, transparency, accountability, and reuse throughout
        the research process.
      nn: Ein måte å driva forsking på som fremjar openheit, transparens, ansvarlegheit og gjenbruk gjennom
        heile forskingsprosessen.
    definition:
      en: >
        Open Science is an approach to conducting and communicating research that seeks to make research
        processes and outputs as open, transparent, accountable, and reusable as possible. It encourages
        practices such as sharing research data, publications, methods, software, and other research outputs,
        thereby supporting verification, collaboration, and the reuse of research results.
      nn: >
        Open vitskap er ein måte å gjennomføra og formidla forsking på som søkjer å gjera forskingsprosessar
        og forskingsresultat så opne, transparente, ansvarlege og gjenbrukbare som mogleg. Dette fremjar
        praksisar som deling av forskingsdata, publikasjonar, metodar, programvare og andre forskingsresultat,
        og stør dermed opp om etterprøving, samarbeid og gjenbruk av forskingsresultat.
    aliases:
      en:
      - open research
      nn:
      - open forsking
      - open science
      - åpen forskning
    related:
    - research-data
    - open-access
    - fair
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Open Science'
      url: https://forrt.org/glossary/english/open_science/
      open: new-tab
    status: active
  persistent-identifier:
    label:
      en: Persistent Identifier (PID)
      nn: persistent identifikator (PID)
    short_definition:
      en: A long-lasting identifier for a resource, person, organization, or other entity.
      nn: Ein varig identifikator for ein ressurs, person, organisasjon eller anna eining.
    definition:
      en: >
        A Persistent Identifier (PID) is a stable identifier designed to remain valid over time and provide
        a reliable reference to a specific entity. PIDs can be assigned to digital resources such as datasets
        and publications, as well as to researchers, organizations, and other entities. Examples include
        [REUSE: terms/digital-object-identifier | DOI] identifiers for datasets, [REUSE: terms/open-researcher-and-contributor-id | ORCID] identifiers for researchers, and [REUSE: terms/research-organization-registry | ROR ] identifiers for research organizations.
      nn: >
        Ein persistent identifikator (PID) er ein varig identifikator som er laga for å vera gyldig over
        tid og gje ei påliteleg tilvising til ei bestemt eining. PID-ar kan tildelast digitale ressursar
        som datasett og publikasjonar, men òg forskarar, organisasjonar og andre einingar. Døme er [REUSE:
        terms/digital-object-identifier | DOI-identifikatorar] for datasett, [REUSE: terms/open-researcher-and-contributor-id | ORCID-identifikatorar] for forskarar og [REUSE: terms/research-organization-registry | ROR-identifikatorar] for forskingsorganisasjonar.
    aliases:
      en:
      - PID
      nn:
      - PID
      - varig identifikator
      - varig ID
    related:
    - digital-object-identifier
    - open-researcher-and-contributor-id
    - research-organization-registry
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Persistent Identifier (PID)'
      url: https://terms.codata.org/rdmt/persistent-identifier
      open: new-tab
    status: active
  preservation:
    label:
      en: Preservation
      nn: langtidsbevaring
    short_definition:
      en: Activities that help ensure the long-term accessibility and usability of digital information.
      nn: Tiltak som bidreg til langsiktig tilgang til og bruk av digital informasjon.
    definition:
      en: >
        Preservation consists of organizational and technical measures intended to keep datasets accessible,
        understandable, and usable over time.
      nn: >
        Langtidsbevaring omfattar organisatoriske og tekniske tiltak som skal halda datasett tilgjengelege,
        forståelege og brukbare over tid.
    aliases:
      en:
      - digital preservation
      nn: []
    related:
