      en: Harvesting
      nn: hausting
    short_definition:
      en: Automatic collection of metadata from repositories.
      nn: Automatisk innsamling av metadata frå arkiv.
    definition:
      en: >
        Harvesting is the process whereby one system collects metadata from another system. It helps make
        datasets discoverable through external search and discovery services.
      nn: >
        Hausting er prosessen der eitt system samlar inn metadata frå eit anna system. Dette bidreg til
        å gjera datasett synlege i eksterne søkje- og gjenfinningstenester.
    aliases:
