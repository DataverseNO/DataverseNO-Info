  license:
    label:
      en: License
      nn: lisens
    short_definition:
      en: A statement defining how a dataset may be (re-)used.
      nn: Ei erklæring som definerer korleis eit datasett kan (gjen)brukast.
    definition:
      en: >
        A license specifies the permissions and conditions that apply to the reuse of a dataset. In DataverseNO, every dataset must be assigned a license or equivalent terms of use when it is deposited. Licensing information is included in the dataset metadata and helps users understand how the data may be accessed, used, and shared. DataverseNO recommends open licenses that facilitate data reuse, particularly Creative Commons CC0, while allowing depositors to specify alternative terms of use where appropriate.
      nn: >
        Ein lisens fastset kva løyve og vilkår som gjeld for gjenbruk av eit datasett. I DataverseNO må
        alle datasett få ein lisens eller tilsvarande bruksvilkår når dei blir deponerte. Lisensinformasjon
        inngår i metadataa til datasettet og hjelper brukarar med å forstå korleis datasettet kan aksesserast,
        gjenbrukast og delast (vidare). DataverseNO tilrår opne lisensar som legg til rette for gjenbruk
        av data, særleg Creative Commons CC0, samstundes som deponentar kan oppgje andre bruksvilkår når
        det er relevant.
    aliases:
      en:
      - terms of use
      nn:
      - bruksvilkår
      - bruksbetingelser
      - løyve
    related:
    - terms-of-use
    - dataset
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Open Licenses'
      url: https://forrt.org/glossary/english/open_licenses/
      open: new-tab
    status: active
  metadata:
    label:
      en: Metadata
      nn: metadata
    short_definition:
      en: Information describing a dataset.
      nn: Informasjon som beskriv eit datasett.
    definition:
      en: >
        Metadata is structured information that describes a dataset, such as its title, authors, keywords,
        dates, methods, and license. Metadata helps users find, understand, cite, and reuse data.
      nn: >
        Metadata er strukturert informasjon som beskriv eit datasett, til dømes tittel, forfattarar, nøkkelord, datoar, metodar og lisens. Metadata hjelper brukarar med å finna, forstå, sitera og bruka data på nytt.
    aliases:
      en:
      - dataset metadata
      nn: []
    related:
    - dataset
    - fair
    - harvesting
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Metadata'
      url: https://forrt.org/glossary/english/metadata/
      open: new-tab
    status: active
  open-access:
    label:
      en: Open Access
      nn: open tilgang
    short_definition:
      en: Free and unrestricted access to digital resources.
      nn: Fri og uavgrensa tilgang til digitale ressursar.
    definition:
      en: >
        Open Access means that digital resources are made available online without price barriers or access
        restrictions.
      nn: >
        Open tilgang betyr at digitale ressursar blir gjorde tilgjengelege på nett utan betalingsmurar
        eller tilgangsavgrensingar.
    aliases:
