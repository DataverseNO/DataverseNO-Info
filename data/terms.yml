      open: new-tab
    status: active
  preview-url:
    label:
      en: Preview URL
      nn: Preview URL
    short_definition:
      en: A private link that provides read-only access to an unpublished dataset.
      nn: Ei privat lenkje som gjev lesetilgang til eit upublisert datasett.
    definition:
      en: >
        A Preview URL is a private link that provides access to an unpublished dataset without making
        the dataset publicly accessible. Users accessing a dataset via a Preview URL can view and download
        the dataset and its files, but cannot edit the dataset. In DataverseNO, Preview URLs are typically
        created by curators upon request and may be used, for example, to provide access to editors and
        reviewers during peer review of a publication manuscript related to the dataset.
      nn: >
        Ein Preview URL er ei privat lenkje som gir tilgang til eit upublisert datasett utan å gjera datasettet ope tilgjengeleg. Brukarar som får tilgang via ein Preview URL, kan sjå og lasta ned datasettet og filene, men kan ikkje redigera datasettet. I DataverseNO blir preview-URL-ar vanlegvis oppretta av kuratorar på førespurnad og kan til dømes brukast til å gje redaktørar og fagfellar tilgang under fagfellevurdering av eit manuskript som er knytt til datasettet.
    aliases:
      en:
      - private URL
      nn:
      - førehandsvisingslenkje
      - forhandsvisningslenke
    related:
    - dataset
    - double-blind-peer-review
    - curation
    further_reading: []
    status: active
  readme-file:
    label:
      en: README File
      nn: README-fil
    short_definition:
      en: A document that explains a dataset and its contents.
      nn: Eit dokument som forklarar eit datasett og innhaldet i det.
    definition:
      en: >
        A README file is a document that provides the information needed to understand, interpret, and
        reuse a dataset. In DataverseNO, a README file is a mandatory component of all datasets and must
        be based on an approved README template or contain equivalent information. Typical contents include
        information about the dataset, methods, files, terms of reuse, and contact details.
      nn: >
        Ei README-fil er eit dokument som gjev informasjonen som trengst for å forstå, tolka og bruka
        eit datasett på nytt. I DataverseNO er README-fil obligatorisk for alle datasett og må byggja
        på ein godkjend README-mal eller innehalda tilsvarande informasjon. Typisk innhald er informasjon
        om datasettet, metodar, filer, bruksvilkår og kontaktopplysningar.
    aliases:
      en:
      - README
      - README template
      nn:
      - README
    related:
    - dataset
    - metadata
    - dataverseno-deposit-guidelines
    further_reading:
    - link_id: dataverseno-readme-template-general
    - link_id: dataverseno-readme-template-software-code
    status: active
  repository:
    label:
      en: Repository
      nn: arkiv
    short_definition:
      en: A service used to manage, preserve, and provide access to digital resources.
      nn: Ei teneste som blir brukt til å forvalta, bevara og gje tilgang til digitale ressursar.
    definition:
      en: >
        A repository is a service that stores, manages, preserves, and provides access to digital resources
        such as datasets. In addition to providing storage, repositories support activities such as discovery, citation, curation, sharing, preservation, and reuse. DataverseNO is a repository for research data.
      nn: >
        Eit arkiv er ei teneste som lagrar, forvaltar, bevarer og gjev tilgang til digitale ressursar
        som til dømes datasett. I tillegg til lagring støttar arkiv gjenfinning, sitering, kuratering,
        deling, bevaring og gjenbruk. DataverseNO er eit arkiv for forskingsdata.
    aliases:
      en:
      - data repository
      nn:
      - repository
      - dataarkiv
      - forskingsdataarkiv
      - forskningsdataarkiv
    related:
    - dataset
    - collection
    - preservation
    - trustworthy-digital-repository
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Repository'
      url: https://terms.codata.org/rdmt/repository
      open: new-tab
    status: active
  research-data:
    label:
      en: Research Data
      nn: forskingsdata
    short_definition:
      en: Data created, collected, observed, measured, or generated during research.
      nn: Data som blir skapte, samla inn, observerte, målte eller genererte i forsking.
    definition:
      en: >
        Research data are data that are created, collected, observed, measured, or generated during research
        and that are used as evidence in the research process or needed to validate research findings.
        Research data may take many forms, including measurements, observations, survey responses, interview
        transcripts, images, audio recordings, software-generated data, models, and code.
      nn: >
        Forskingsdata er data som blir skapte, samla inn, observerte, målte eller genererte i forsking,
        og som blir brukte som dokumentasjon i forskingsprosessen eller trengst for å validera forskingsfunn.
        Forskingsdata kan ha mange former, til dømes målingar, observasjonar, svar frå spørjeundersøkingar,
        intervjutranskripsjonar, bilete, lydopptak, programvaregenererte data, modellar og kode.
    aliases:
      en:
      - research datasets
      nn:
      - forskningsdata
    related:
    - dataset
    - metadata
    - fair
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Research Data'
      url: https://terms.codata.org/rdmt/research-data
      open: new-tab
    status: active
  research-organization-registry:
    label:
      en: Research Organization Registry (ROR)
      nn: Research Organization Registry (ROR)
    short_definition:
      en: A global identifier system for research organizations.
      nn: Eit globalt register for informasjon om forskingsorganisasjonar.
    definition:
      en: >
        The Research Organization Registry (ROR) provides unique identifiers for research organizations
        and helps connect datasets, publications, researchers, and institutions.
      nn: >
        Research Organization Registry (ROR) tildeler unike identifikatorar til forskingsorganisasjonar
        og hjelper til med å knyta datasett, publikasjonar, forskarar og institusjonar saman.
    aliases:
      en:
      - ROR
      nn:
      - ROR
    related:
    - persistent-identifier
    - open-researcher-and-contributor-id
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Research Organization Registry (ROR)'
      url: https://terms.codata.org/rdmt/research-organisation-registry
      open: new-tab
    status: active
  terms-of-use:
    label:
      en: Terms of Use
      nn: bruksvilkår
    short_definition:
      en: Conditions that govern how a dataset may be accessed and reused.
      nn: Vilkår som regulerer korleis eit datasett kan aksesserast og brukast på nytt.
    definition:
      en: >
        Terms of Use specify the permissions, restrictions, responsibilities, and conditions that apply
        when using a dataset. Terms of Use may take different forms, including standardized [REUSE: terms/license | licenses] and customized reuse conditions defined by the depositor. In DataverseNO, every dataset must have Terms of Use, whenever possible in the form of a standardized open license to facilitate the discovery, sharing, and reuse of research data.
      nn: >
        Bruksvilkår fastset kva løyve, avgrensingar, ansvar og vilkår som gjeld ved bruk av eit datasett.
        Bruksvilkår kan ha ulike former, mellom anna standardiserte [REUSE: terms/license | lisensar]
        og tilpassa gjenbruksvilkår definerte av deponenten. I DataverseNO må alle datasett ha bruksvilkår,
        så langt som mogleg i form av ein standardisert open lisens for å gjera det lettare å finna, dela
        og bruka forskingsdata på nytt.
    aliases:
      en:
      - use conditions
      nn:
      - bruksbetingelser
      - vilkår for bruk
      - terms of use
    related:
    - license
    - dataset
    - data-requiring-protection
    further_reading: []
    status: active
  trustworthy-digital-repository:
    label:
      en: Trustworthy Digital Repository (TDR)
      nn: påliteleg digitalt arkiv (TDR)
    short_definition:
      en: A repository that demonstrates reliable stewardship of digital resources.
      nn: Eit arkiv som har dokumentert at det forvaltar sine digitale ressursar på ein påliteleg måte.
    definition:
      en: >
        A Trustworthy Digital Repository (TDR) is a repository that follows recognized standards and practices for the long-term management, preservation, and provision of access to digital resources.
      nn: >
        Eit påliteleg digitalt arkiv (TDR) er eit arkiv som følgjer anerkjende standardar og praksisar
        for langsiktig forvaltning, bevaring og tilgang til digitale ressursar.
    aliases:
      en:
      - TDR
      nn:
      - TDR
      - Trustworthy Digital Repository
    related:
    - coretrustseal
    - repository
    - preservation
    further_reading: []
    status: active
  version-control:
    label:
      en: Version Control
      nn: versjonskontroll
    short_definition:
      en: Management of changes made to a dataset over time.
      nn: Forvaltning av endringar i eit datasett over tid.
    definition:
      en: >
        Version Control is the practice of recording and managing changes to a dataset and its metadata.
        In DataverseNO, changes made after publication result in a new dataset version while previous
        versions remain accessible.
      nn: >
        Versjonskontroll er praksisen med å registrera og forvalta endringar i eit datasett og metadataa
        til datasettet. I DataverseNO fører endringar etter publisering til ein ny versjon av datasettet,
        medan tidlegare versjonar framleis er tilgjengelege.
    aliases:
      en:
      - versioning
      nn:
      - versjonering
    related:
    - dataset
    - metadata
    - preservation
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Version Control'
      url: https://terms.codata.org/rdmt/version-control
      open: new-tab
    status: active
