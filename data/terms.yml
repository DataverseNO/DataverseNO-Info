version: 0.5
created: '2026-08-09'
last_updated: '2026-08-09'
description: Authoritative terminology and glossary data for the DataverseNO Information Website.
principles:
- Term identifiers are language-neutral, lowercase, hyphen-separated where required, and stable over time.
- Labels, short definitions, full definitions, aliases, related terms, and notes are localized or language-aware
  where relevant.
- English and Norwegian Nynorsk pages shall reference the same term identifiers.
- Norwegian Nynorsk labels use idiomatic Nynorsk; common nouns normally start with lower-case letters,
  while names, acronyms, and named entities keep their established capitalization.
- Norwegian Nynorsk uses a-infinitives consistently.
- Norwegian Nynorsk aliases may include common Norwegian Bokmål or English equivalents to improve discoverability.
- Aliases and related terms should be useful but limited; they should not become uncontrolled keyword
  lists.
- Glossary pages and inline definition reuse are generated from this file.
terms:
  authorship:
    label:
      en: Authorship
      nn: forfattarskap
    short_definition:
      en: Recognition of a person’s intellectual contribution to a dataset.
      nn: Anerkjenning av det faglege bidraget ein person har gjeve til eit datasett.
    definition:
      en: >
        Authorship identifies the people who have made substantial intellectual contributions to creating,
        collecting, producing, or preparing a dataset. In DataverseNO, authors are credited in the dataset
        metadata and dataset citation.
      nn: >
        Forfattarskap viser kven som har gjeve vesentlege faglege bidrag til å skapa, samla inn, produsera
        eller klargjera eit datasett. I DataverseNO blir forfattarar krediterte i metadataa og i referansen
        til datasettet.
    aliases:
      en:
      - author credit
      nn:
      - forfatterskap
      - opphav
      - forfattarkreditering
      - forfatterkreditering
    related:
    - dataset
    - citation
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Authorship'
      url: https://forrt.org/glossary/english/authorship/
      open: new-tab
    status: active
  citation:
    label:
      en: Citation
      nn: sitering
    short_definition:
      en: A standardized reference to a dataset or other research output.
      nn: Ei standardisert tilvising til eit datasett eller eit anna forskingsresultat.
    definition:
      en: >
        A citation provides the information needed to identify, locate, and acknowledge a dataset or data
        file. In DataverseNO, citations are automatically generated and can be copied directly from dataset
        and file landing pages. Dataset citations normally include the authors, title, publication year,
        repository, version, and DOI.
      nn: >
        Ei sitering gjev informasjonen som trengst for å identifisera, finna og kreditera eit datasett
        eller ei datafil. I DataverseNO blir siteringar genererte automatisk og kan kopierast direkte
        frå landingssidene for datasett og filer. Ei datasettsitering inneheld vanlegvis forfattarar,
        tittel, publiseringsår, arkiv, versjon og DOI.
    aliases:
      en:
      - data citation
      - reference
      nn:
      - referanse
      - tilvising
      - henvisning
      - kjeldetilvising
      - kildehenvisning
      - kjeldereferanse
      - kildereferanse
    related:
    - dataset
    - authorship
    - digital-object-identifier
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Citation'
      url: https://terms.codata.org/rdmt/data-citation
      open: new-tab
    status: active
  collection:
    label:
      en: Collection
      nn: samling
    short_definition:
      en: A group of datasets managed together within a repository.
      nn: Ei gruppe datasett som blir forvalta samla i eit arkiv.
    definition:
      en: >
        A collection is an area within a repository used to organize and manage related datasets. In DataverseNO,
        most collections represent partner institutions. Some collections represent projects, research
        groups, research infrastructures, or other organizational units.
      nn: >
        Ei samling er eit område i eit arkiv som blir brukt til å organisera og forvalta relaterte datasett.
        I DataverseNO representerer dei fleste samlingane partnarinstitusjonar. Nokre samlingar representerer
        prosjekt, forskingsgrupper, forskingsinfrastrukturar eller andre organisatoriske einingar.
    aliases:
      en:
      - institutional collection
      - subcollection
      nn:
      - institusjonssamling
      - delsamling
      - subsamling
    related:
    - repository
    - dataset
    - institutional-collection
    further_reading: []
    status: active
  coretrustseal:
    label:
      en: CoreTrustSeal
      nn: CoreTrustSeal
    short_definition:
      en: An international certification for trustworthy digital repositories (TDRs).
      nn: Ei internasjonal sertifiseringsordning for pålitelege digitale arkiv.
    definition:
      en: >
        CoreTrustSeal is a certification that demonstrates that a repository meets recognized requirements
        for the trustworthy management, preservation, and provision of digital resources. DataverseNO
        obtained CoreTrustSeal certification for the first time in 2020 and is currently renewing its
        certification.
      nn: >
        CoreTrustSeal er ei sertifisering som viser at eit arkiv oppfyller anerkjende krav til påliteleg
        forvaltning, bevaring og formidling av digitale ressursar. DataverseNO fekk CoreTrustSeal-sertifisering
        for første gong i 2020 og arbeider no med å fornya sertifiseringa.
    aliases:
      en:
      - CTS
      nn: []
    related:
    - trustworthy-digital-repository
    - repository
    - preservation
    further_reading: []
    status: active
  curation:
    label:
      en: Curation
      nn: kuratering
    short_definition:
      en: Review and improvement of a dataset before publication in DataverseNO.
      nn: Gjennomgang og forbetring av eit datasett før publisering i DataverseNO.
    definition:
      en: >
        In DataverseNO, curation is the process of reviewing a dataset and providing guidance on metadata,
        documentation, file formats, licensing, and other aspects that support data sharing and reuse.
        Datasets are curated before publication to help align them with DataverseNO policies, deposit
        guidelines, and recognized good practices for research data management, in particular the FAIR
        Principles.
      nn: >
        I DataverseNO er kuratering prosessen der eit datasett blir gjennomgått, og der deponenten får
        rettleiing om metadata, dokumentasjon, filformat, lisensiering og andre forhold som fremjar deling
        og gjenbruk av data. Datasett blir kuraterte før publisering for å sørgja for at dei blir i tråd
        med DataverseNO sine policyar, deponeringsrettleiingar og anerkjend god praksis for forskingsdatahandtering,
        særleg FAIR-prinsippa.
    aliases:
      en:
      - data curation
      - data review
      - review
      nn:
      - kvalitetssikring
      - datakuratering
      - kuratering av data
      - gjennomgang
    related:
    - dataset
    - curator
    - metadata
    - fair
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Curation'
      url: https://terms.codata.org/rdmt/curation
      open: new-tab
    status: active
  curation-label:
    label:
      en: Curation Label
      nn: kurateringstagg
    short_definition:
      en: A label indicating the current status of a dataset during curation in DataverseNO.
      nn: Ein merkelapp som viser statusen til eit datasett under kuratering i DataverseNO.
    definition:
      en: >
        A curation label is used by DataverseNO curators to track and communicate the progress of a dataset
        through the curation workflow.
      nn: >
        Ein kurateringstagg blir brukt av DataverseNO-kuratorar til å spora og kommunisera framdrifta
        til eit datasett gjennom kurateringsarbeidsflyten.
    aliases:
      en:
      - curation status
      nn:
      - kurateringsstatus
    related:
    - curation
    - curator
    - dataset
    further_reading: []
    status: active
  curator:
    label:
      en: Curator
      nn: kurator
    short_definition:
      en: A person who reviews datasets before publication in DataverseNO.
      nn: Ein person som går gjennom datasett før publisering i DataverseNO.
    definition:
      en: >
        A curator is a member of research support staff who reviews datasets and provides guidance to
        depositors. Curators help ensure that datasets comply with DataverseNO policies, deposit guidelines,
        and recognized good practices for research data management. Information about the curators at
        DataverseNO partner institutions is available on the [PAGE: about/people | People page].
      nn: >
        Ein kurator er ein tilsett i forskingsstøtta som går gjennom datasett og gjev rettleiing til deponentar.
        Kuratorar hjelper til med å sikra at datasett følgjer DataverseNO sine policyar, deponeringsrettleiingar
        og anerkjend god praksis for forskingsdatahandtering. Informasjon om kuratorane på DataverseNO
        sine partnarinstitusjonar finst på [PAGE: about/people | Folk-sida].
    aliases:
      en:
      - data curator
      nn:
      - datakurator
    related:
    - curation
    - depositor
    - dataset
    further_reading: []
    status: active
  data-requiring-protection:
    label:
      en: Data requiring protection
      nn: data med beskyttelsesbehov
    short_definition:
      en: Research data that cannot be shared openly in its raw or current form because of legal, ethical, institutional, or security-related constraints.
      nn: Forskingsdata som ikkje kan delast ope i rå eller noverande form på grunn av juridiske, etiske, institusjonelle eller tryggleiksomsyn.
    definition:
      en: >
        Data requiring protection are research data that cannot be shared openly
        in their raw or current form. This may be because of legal, ethical,
        institutional, or security-related constraints.

        In DataverseNO, this includes:

        - **Personal and health data:** Data that can be linked to identifiable
          persons or medical records.
        - **Indigenous data:** Data that are subject to cultural oversight,
          traditional ownership, or specific governance protocols.
        - **Intellectual property:** Copyrighted material or commercially
          sensitive data.
        - **Environmental risks:** Sensitive biodiversity data, such as locations
          of endangered species.
        - **Safety risks:** Data involving geopolitical or security-related
          concerns.
        - **Rights restrictions:** Data for which the researcher does not have
          the necessary rights and permissions.

        Such data must be handled before they can be shared openly. This may
        include preparatory steps such as anonymization. If the data cannot be
        prepared for open sharing, they should be directed to a suitable
        alternative repository instead of being deposited directly in DataverseNO.
      nn: >
        Data med beskyttelsesbehov er forskingsdata som ikkje kan delast ope
        i rå eller noverande form. Dette kan vera på grunn av juridiske,
        etiske, institusjonelle eller tryggleiksomsyn.

        I DataverseNO omfattar dette:

        - **Person- og helsedata:** Data som kan knytast til identifiserbare
          personar eller medisinske journalar.
        - **Urfolksdata:** Data som er underlagde kulturell kontroll,
          tradisjonelt eigarskap eller særskilde styringsprotokollar.
        - **Immaterielle rettar:** Opphavsrettsleg verna materiale eller
          kommersielt sensitive data.
        - **Miljørisiko:** Sensitive artsmangfaldsdata, til dømes lokalitetar
          for truga artar.
        - **Tryggleiksrisiko:** Data som gjeld geopolitiske eller
          tryggleiksrelaterte forhold.
        - **Rettigheitsavgrensingar:** Data der forskaren ikkje har nødvendige
          rettar og løyve.

        Slike data må handterast før dei kan delast ope. Dette kan til dømes
        innebera anonymisering. Dersom dataa ikkje kan klargjerast for open
        deling, bør dei visast vidare til eit eigna alternativt arkiv i staden
        for å arkiverast i DataverseNO.
    aliases:
      en:
        - protected data
        - sensitive data
      nn:
        - data med beskyttelsesbehov
        - beskyttelsesverdige data
        - sensitive data
    related:
      - research-data
      - terms-of-use
      - license
    further_reading:
      - title: DataverseNO Data Privacy Guide
        url: null
        open: new-tab
        status: pending-url
    status: active
  dataset:
    label:
      en: Dataset
      nn: datasett
    short_definition:
      en: A collection of files and metadata treated as a single unit.
      nn: Ei samling filer og metadata som blir handsama som ei eining.
    definition:
      en: >
        A dataset consists of one or more files together with metadata and documentation describing them.
        In DataverseNO, datasets are the primary units that are archived, curated, published, cited, and
        preserved.
      nn: >
        Eit datasett består av éi eller fleire datafiler i tillegg til metadata og dokumentasjon som beskriv
        dataa. I DataverseNO er datasett dei viktigaste einingane som blir arkiverte, kuraterte, publiserte,
        siterte og bevarte.
    aliases:
      en:
      - data set
      nn: []
    related:
    - research-data
    - metadata
    - readme-file
    - citation
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Dataset'
      url: https://terms.codata.org/rdmt/dataset
      open: new-tab
    status: active
  dataverseno-deposit-agreement:
    label:
      en: DataverseNO Deposit Agreement
      nn: DataverseNO Deposit Agreement
    short_definition:
      en: An agreement defining the conditions for depositing data in DataverseNO.
      nn: Ein avtale som definerer vilkåra for å deponera data i DataverseNO.
    definition:
      en: >
        The DataverseNO Deposit Agreement defines the rights and responsibilities of depositors and DataverseNO
        when datasets are submitted to the repository. The agreement forms part of the [REUSE: terms/dataverseno-policy-framework]
        and applies to all datasets deposited in DataverseNO.
      nn: >
        DataverseNO Deposit Agreement definerer rettane og pliktene til deponentar og DataverseNO når
        datasett blir sende inn til arkivet. Avtalen er ein del av [REUSE: terms/dataverseno-policy-framework]
        og gjeld for alle datasett som blir deponerte i DataverseNO.
    aliases:
      en:
      - deposit agreement
      nn:
      - DataverseNO-deponeringsavtale
      - deponeringsavtale
      - DataverseNO-arkiveringsavtale
      - arkiveringsavtale
    related:
    - deposit
    - depositor
    - dataverseno-policy-framework
    further_reading:
    - link_id: dataverseno-deposit-agreement
    status: active
  dataverseno-deposit-guidelines:
    label:
      en: DataverseNO Deposit Guidelines
      nn: DataverseNO-arkiveringsguide
    short_definition:
      en: Requirements and recommendations for preparing and depositing datasets in DataverseNO.
      nn: Krav og tilrådingar for å klargjera og deponera datasett i DataverseNO.
    definition:
      en: >
        The DataverseNO Deposit Guidelines describe how datasets should be organized, documented, described,
        licensed, uploaded, and submitted for review and publication in DataverseNO. The guidelines help
        depositors align their datasets with DataverseNO requirements and recognized good practices for
        research data management. The guidelines are available on the [PAGE: deposit | Deposit Guidelines
        page].
      nn: >
        DataverseNO-deponeringsrettleiinga skildrar korleis datasett bør organiserast, dokumenterast,
        skildrast, lisensierast, lastast opp og sendast inn til gjennomgang og publisering i DataverseNO.
        Rettleiinga hjelper deponentar med å tilpassa datasetta til DataverseNO sine krav og anerkjend
        god praksis for forskingsdatahandtering. Rettleiinga er tilgjengeleg i [PAGE: deposit | arkiveringsguiden].
    aliases:
      en:
      - deposit guidelines
      nn:
      - deponeringsrettleiing
      - deponeringsveiledning
      - arkiveringsrettleiing
      - arkiveringsveiledning
    related:
    - deposit
    - dataset
    - metadata
    - readme-file
    further_reading: []
    status: active
