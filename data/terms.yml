  deposit:
    label:
      en: Deposit
      nn: deponering
    short_definition:
      en: The process of submitting a dataset to a repository.
      nn: Det å senda inn eit datasett til eit arkiv.
    definition:
      en: >
        A deposit is the submission of a dataset, including files, metadata, and documentation, to a repository
        for review, publication, and preservation.
      nn: >
        Å deponera betyr å registrera og lasta opp eit datasett, med filer, metadata og dokumentasjon,
        til eit arkiv for gjennomgang, publisering og bevaring.
    aliases:
      en:
      - data deposit
      nn:
      - arkivering
      - opplasting
      - registrering
    related:
