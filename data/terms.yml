  open-researcher-and-contributor-id:
  open-researcher-and-contributor-id:
    label:
      en: Open Researcher and Contributor ID (ORCID)
      nn: Open Researcher and Contributor ID (ORCID)
    short_definition:
      en: A persistent identifier for researchers.
      nn: Ein varig identifikator for forskarar.
    definition:
      en: >
        Open Researcher and Contributor ID (ORCID) is a globally unique identifier that distinguishes
        researchers and helps connect them to their publications, datasets, and other research outputs.
      nn: >
        Open Researcher and Contributor ID (ORCID) er ein globalt unik identifikator som skil forskarar
        frå kvarandre og hjelper til med å knyta dei til publikasjonar, datasett og andre forskingsresultat.
    aliases:
