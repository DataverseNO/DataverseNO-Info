      nn: deponent
    short_definition:
      en: A person who submits a dataset to a repository.
      nn: Ein person som sender inn eit datasett til eit arkiv.
    definition:
      en: >
        A depositor is a person who creates or manages a dataset submission and submits it for review
        and publication in DataverseNO.
      nn: Ein deponent er ein person som opprettar og forvaltar eit datasett for arkivering i DataverseNO.
    aliases:
      en:
      - data depositor
      nn: []
    related:
    - deposit
    - dataset
    - dataverseno-deposit-agreement
    further_reading: []
    status: active
  designated-community:
    label:
      en: Designated Community
      nn: målgruppe
    short_definition:
      en: The group of users for whom preserved information should remain understandable.
      nn: Brukargruppa som arkiverte data skal vera forståelege for.
    definition:
      en: >
        A Designated Community is the group of users that a repository expects to access and reuse preserved
        data. DataverseNO aims to ensure that published datasets remain understandable to their intended
        research communities.
      nn: >
        Ei målgruppe er dei aktørane som eit arkiv ventar skal kunna få tilgang til og bruka arkiverte
        data. DataverseNO har som mål å sikra at publiserte datasett held fram med å vera forståelege
        for dei aktuelle forskingsmiljøa.
    aliases:
      en:
      - user community
      nn:
      - brukargruppe
      - brukergruppe
      - brukarmiljø
      - brukermiljø
    related:
    - preservation
    - trustworthy-digital-repository
    - repository
    further_reading: []
    status: active
  digital-object-identifier:
    label:
      en: Digital Object Identifier (DOI)
      nn: Digital Object Identifier (DOI)
    short_definition:
      en: A persistent identifier used to identify and reference a dataset, file, or other digital resource.
      nn: Ein varig identifikator som blir brukt til å identifisera og referera til eit datasett, ei fil
        eller ein annan digital ressurs.
    definition:
      en: >
        A Digital Object Identifier (DOI) is a globally unique and persistent identifier that provides
        a stable reference to a digital resource. In DataverseNO, datasets and individual files within
        datasets are assigned DOIs that support citation, discovery, and long-term access.
      nn: >
        Ein Digital Object Identifier (DOI) er ein globalt unik og varig identifikator som mogleggjer
        stabil tilvising til ein digital ressurs. I DataverseNO får datasett og enkeltfiler i datasett
        DOI-ar som støttar sitering, gjenfinning og langsiktig tilgang.
    aliases:
      en:
      - DOI
      nn:
      - DOI
      - digital objektsidentifikator
      - persistent identifikator
    related:
    - persistent-identifier
    - citation
    - dataset
    further_reading:
    - title: 'CODATA Research Data Management Terminology: Digital Object Identifier (DOI)'
      url: https://terms.codata.org/rdmt/digital-object-identifier
      open: new-tab
    status: active
  double-blind-peer-review:
    label:
      en: Double-Blind Peer Review
      nn: dobbelblind fagfellevurdering
    short_definition:
      en: A review process in which neither authors nor reviewers know each other’s identities.
      nn: Ein vurderingsprosess der korkje forfattarar eller fagfellar kjenner identiteten til kvarandre.
    definition:
      en: >
        Double-blind peer review is a review process intended to reduce bias by keeping both authors and
        reviewers anonymous during manuscript evaluation.
      nn: >
        Dobbelblind fagfellevurdering er ein vurderingsprosess som skal sikra objektiv, upartisk og rettferdig
        evaluering ved å halda både forfattarar og fagfellar anonyme under vurderinga av eit manuskript.
    aliases:
      en:
      - anonymous peer review
      nn:
      - anonym fagfellevurdering
    related:
    - preview-url
    - dataset
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Double-Blind Peer Review'
      url: https://forrt.org/glossary/english/double_blind_peer_review/
      open: new-tab
    status: active
  embargo:
    label:
      en: Embargo
      nn: embargo
    short_definition:
      en: A temporary restriction on access to data files.
      nn: Ei mellombels tilgangsavgrensing for datafiler.
    definition:
      en: >
        An embargo is a temporary restriction on access to one or more files in a dataset. In DataverseNO,
        embargoes may be applied only to unpublished data files and normally for no longer than [REUSE:
        values/embargo-period-limit]. During the embargo period, the embargoed files are inaccessible,
        while the dataset metadata and README file remain publicly available. Embargoes expire automatically
        on a specified date, after which the files become openly accessible. Once a dataset has been published, the embargo period cannot normally be extended or modified by the depositor. Embargoes are intended for temporary restrictions on access to files and should not be used to delay the publication
        of datasets associated with manuscripts under review.
      nn: >
        Ein embargo er ei mellombels tilgangsavgrensing for éi eller fleire filer i eit datasett. I DataverseNO kan embargo berre leggjast på upubliserte datafiler og normalt ikkje i meir enn [REUSE: values/embargo-period-limit]. I embargoperioden er filene utilgjengelege, medan metadataa og README-fila til datasettet er ope tilgjengelege. Embargoar går automatisk ut på ein oppgjeven dato, og etter dette blir filene ope tilgjengelege. Når eit datasett er publisert, kan embargoperioden normalt ikkje forlengjast eller endrast av deponenten. Embargoar er meinte for mellombelse tilgangsavgrensingar til filer og bør ikkje brukast til å utsetja publisering av datasett som høyrer til manuskript under vurdering.
    aliases:
      en:
      - embargo period
      nn:
      - embargoperiode
    related:
    - dataset
    - terms-of-use
    - preview-url
    further_reading:
    - title: 'Framework for Open and Reproducible Research Training (FORRT): Embargo'
      url: https://forrt.org/glossary/english/embargo_period/
      open: new-tab
    status: active
  fair:
    label:
      en: FAIR
      nn: FAIR
    short_definition:
      en: A set of principles that help make research data Findable, Accessible, Interoperable, and Reusable.
      nn: Eit sett prinsipp som skal gjera forskingsdata finnbare, tilgjengelege, interoperable og gjenbrukbare.
    definition:
      en: >
        FAIR is a set of guiding principles for research data management and stewardship. FAIR aims to
        ensure that research data and metadata can be found, accessed, integrated with other data and
        systems, and reused by both humans and machines.
      nn: >
        FAIR er eit sett med rettleiande prinsipp for forskingsdatahandtering og dataforvaltning. Målet
        med FAIR er å sikra at forskingsdata og metadata kan finnast, aksesserast, koplast saman med andre
        data og system og brukast på nytt av både menneske og maskiner.
    aliases:
      en:
      - FAIR Principles
      nn:
      - FAIR-prinsippa
      - FAIR-prinsippene
      - FAIR-prinsipp
    related:
    - metadata
    - curation
    - research-data
    further_reading:
