  institutional-collection:
    label:
      en: Institutional Collection
      nn: institusjonssamling
    short_definition:
      en: A collection representing a participating institution in the DataverseNO collaboration.
      nn: Ei samling som representerer ein partnarinstitusjon i DataverseNO-samarbeidet.
    definition:
      en: >
        An Institutional Collection is a collection within DataverseNO that is managed and curated by
        a partner institution and contains datasets associated with that institution.
      nn: >
        Ei institusjonssamling er ei samling i DataverseNO som blir forvalta og kuratert av ein partnarinstitusjon,
        og som inneheld datasett knytte til denne institusjonen.
