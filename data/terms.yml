      nn: Ein standardprotokoll for å dela metadata mellom system.
    definition:
      en: >
        Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) is a protocol that allows
        metadata to be harvested automatically from repositories and reused in external discovery services.
      nn: >
        Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) er ein protokoll som gjer
        det mogleg å hausta metadata automatisk frå arkiv og bruka dei på nytt i eksterne søkje- og gjenfinningstenester.
