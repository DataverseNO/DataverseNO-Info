    label:
      en: DataverseNO Organizational Agreement
      nn: DataverseNO-forvaltningsavtale
    short_definition:
      en: The governing agreement that defines how DataverseNO is organized and managed.
      nn: Avtale som definerer korleis DataverseNO er organisert og forvalta.
    definition:
      en: >
        The DataverseNO Organizational Agreement describes the governance, roles, responsibilities, competencies,
        and funding arrangements of the DataverseNO consortium and its partner institutions.
      nn: >
        DataverseNO-forvaltningsavtalen beskriv styring, roller, ansvar, kompetanse og finansiering i
        DataverseNO-konsortiet og hos partnarinstitusjonane.
    aliases:
      en:
