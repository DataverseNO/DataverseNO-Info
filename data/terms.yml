    status: active
  dataverseno-policy-framework:
    label:
      en: DataverseNO Policy Framework
      nn: DataverseNO Policy Framework
    short_definition:
      en: The collection of policies governing the operation and use of DataverseNO.
      nn: Samlinga av policyar som styrer drift og bruk av DataverseNO.
    definition:
      en: >
        The DataverseNO Policy Framework consists of the policies, plans, and related documents that define
        how the repository is governed, managed, preserved, and used. An overview of the framework and
        its constituent documents is available on the [PAGE: about/policy-framework | DataverseNO Policy
        Framework page].
      nn: >
        DataverseNO Policy Framework består av policyar, planar og relaterte dokument som definerer korleis
        arkivet blir styrt, forvalta, bevart og brukt. Ei oversikt over rammeverket og dokumenta som inngår,
        finst på [PAGE: about/policy-framework | sida for DataverseNO Policy Framework].
    aliases:
      en:
      - policy framework
      nn:
      - policyrammeverk
    related:
    - dataverseno-organizational-agreement
    - dataverseno-deposit-agreement
    - preservation
    further_reading: []
