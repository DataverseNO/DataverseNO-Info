# Partner directory for info.dataverse.no
# Source of truth for pages containing information about DataverseNO partner institutions, in English and Norwegian Nynorsk.
#
# Notes:
# - Keep one entry per DataverseNO partner institution.
# - Each partner should have at least one contact channel: support.email or support.url.
# - Institutional logos are language-specific and stored under:
#     assets/logos/institutions/en/
#     assets/logos/institutions/nn/
# - Logo filenames currently follow the pattern <institution-id>-logo.png.
# - Use sort_name.en and sort_name.nn as human-readable sorting names.
# - The page generator should sort by sort_name[lang] using Norwegian-aware collation,
#   so that Æ, Ø, Å are sorted after Z.
# - Norwegian/Nynorsk display names should be reviewed by partner institutions where relevant.

