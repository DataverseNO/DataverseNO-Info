version: 0.1

# DataverseNO Information Website reusable links
#
# Purpose:
#   Authoritative, language-aware source for reusable links used across the
#   DataverseNO Information Website.
#
# Principles:
#   - Link identifiers are language-neutral, lowercase, hyphen-separated where required,
#     and stable over time.
#   - URLs are maintained once in this file.
#   - Labels and descriptions are localized for public display and editor guidance.
#   - English and Norwegian Nynorsk pages shall reference the same link identifiers.
#   - If a URL is not yet decided, set url: null and status: pending-url.
#   - If a linked resource is currently available in English only, keep the English
#     title as the label in both languages unless an approved Norwegian Nynorsk label
#     has been established.
#   - Page content should reference link IDs, for example:
#       [REUSE: links/dataverseno-preservation-policy]

