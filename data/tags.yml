version: 0.2

# DataverseNO Information Website controlled tag vocabulary
#
# Purpose:
#   Controlled vocabulary for tagging Website pages and news posts.
#
# Principles:
#   - Tag identifiers are language-neutral, lowercase, hyphen-separated where required,
#     and stable over time.
#   - Page front matter shall use tag identifiers, not localized labels.
#   - Labels and descriptions are localized for public display and editor guidance.
#   - English and Norwegian Nynorsk pages shall use the same tag identifiers.
#   - New tags should only be added after checking whether an existing tag already
#     covers the concept.


# Principles:
#   - Tag identifiers are language-neutral, lowercase, hyphen-separated where required,
#     and stable over time.
#   - Page front matter shall use tag identifiers, not localized labels.
#   - Tag identifiers shall be the same for English and Norwegian Nynorsk pages.
#   - Labels and descriptions are localized for public display and editor guidance.
#   - English labels normally use title case.
#   - Norwegian Nynorsk labels follow ordinary sentence-style capitalization:
#     use lower case for common nouns and adjectives, but capitalize names,
#     acronyms, and named entities such as DataverseNO, DOI, FAIR, and UiT.
#   - Aliases may be used to support search, spelling variants, and relevant synonyms
#     in each language. For Norwegian Nynorsk, aliases may also include common
#     Norwegian Bokmål equivalents to improve discoverability.
#   - New tags should only be added after checking whether an existing tag already
#     covers the concept.




categories:
  data-deposit:
    label:
      en: Data Deposit
      nn: datadeponering
    description:
      en: Content related to depositing, describing, documenting, licensing, citing, and improving the FAIRness of research data.
      nn: Innhald om deponering, dokumentasjon, lisensiering, sitering og FAIR-tilrettelegging av forskingsdata.

  administration:
    label:
      en: Curation and Administration
      nn: kuratering og administrasjon
    description:
      en: Content related to curation, collection management, repository management, quality assurance, and operational workflows.
      nn: Innhald om kuratering, samlingsforvaltning, arkivforvaltning, kvalitetssikring og forvaltningsrelaterte arbeidsflytar.

  governance:
    label:
      en: Governance and Policy
      nn: styring og policy
    description:
      en: Content related to policies, agreements, governance structures, certification, and compliance.
      nn: Innhald om policyar, avtalar, styringsstrukturar, sertifisering og etterleving av krav.

  support:
    label:
      en: Training and Support
      nn: opplæring og støtte
    description:
      en: Content related to training, practical guidance, support services, contact information, and frequently asked questions.
      nn: Innhald om opplæring, rettleiing, støttetenester, kontaktinformasjon og ofte stilte spørsmål.

  service:
    label:
      en: DataverseNO Service
      nn: DataverseNO-tenesta
    description:
      en: General content about DataverseNO, the repository service, and the information website.
      nn: Generelt innhald om DataverseNO, arkivtenesta og informasjonsnettstaden.

  news-and-events:
    label:
      en: News and Events
      nn: nyhende og arrangement
    description:
      en: Content related to news, events, releases, announcements, and service updates.
      nn: Innhald om nyhende, arrangement, utgjevingar, kunngjeringar og tenesteoppdateringar.

